name: Comprobar

# En cada push a main y en los pull requests: comprueba datos/ e index.html y compila la parte en Swift a WebAssembly.
# No publica nada: GitHub Pages publica la rama main tal cual (Settings › Pages › Deploy from a branch), con el
# assets/swift/ que hay en el repositorio. Si este check sale en rojo, lo publicado puede tener un error: arregladlo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - uses: actions/checkout@v4
      - run: swift run generar --comprobar

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/compilar-web.sh
