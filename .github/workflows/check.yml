name: Check

# On every push to main and on pull requests: validates data/ and index.html and compiles the Swift part to WebAssembly.
# It doesn't publish anything: GitHub Pages publishes the main branch as is (Settings › Pages › Deploy from a branch), with
# the assets/swift/ that's in the repository. If this check goes red, what's published may have an error: fix it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - uses: actions/checkout@v4
      - run: swift run generate --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-web.sh
