name: Comprobar y publicar

# En cada push a main: comprueba datos/ e index.html y, solo si todo está bien, publica la web en GitHub Pages.
# En los pull requests solo comprueba. Pages tiene que tener "GitHub Actions" como origen (Settings › Pages › Source).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # para volver a publicar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest   # trae Swift instalado
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift scripts/generar.swift --comprobar

  publicar:
    needs: comprobar   # si la comprobación falla, no se publica nada y la web se queda como estaba
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (sin los datos ni el generador, que ya están dentro de index.html)
        run: rsync -a --exclude '.*' --exclude '_site' --exclude 'datos' --exclude 'scripts' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
