name: Comprobar y publicar

# En cada push a main: comprueba datos/ e index.html, compila la parte en Swift a WebAssembly y, solo si todo está bien,
# publica la web en GitHub Pages. En los pull requests solo comprueba y compila.
# Para publicar, Pages tiene que tener "GitHub Actions" como origen (Settings › Pages › Source).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - uses: actions/checkout@v4
      - run: swift run generar --comprobar

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/compilar-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: swift-wasm
          path: assets/swift

  publicar:
    needs: [comprobar, web]   # si algo falla, no se publica nada y la web se queda como estaba
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web (sin los datos, el código Swift ni los scripts, que ya están dentro de la página)
        run: rsync -a --exclude '.*' --exclude '_site' --exclude 'datos' --exclude 'scripts' --exclude 'Sources' --exclude 'Package.*' ./ _site/ && rm -rf _site/assets/swift
      - name: El WebAssembly recién compilado, por si el del repo no estaba al día
        uses: actions/download-artifact@v4
        with:
          name: swift-wasm
          path: _site/assets/swift
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
